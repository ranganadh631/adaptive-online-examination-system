
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Examination Results - Adaptive Exam
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #1f2937;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            min-height: 70px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding:
                10px 35px;

            gap: 20px;

            flex-wrap: wrap;
        }


        .logo {

            text-decoration: none;

            font-size: 22px;

            font-weight: 700;

            color: #2563eb;
        }


        .logo span {

            color: #111827;
        }


        nav {

            display: flex;

            align-items: center;

            gap: 5px;

            flex-wrap: wrap;
        }


        nav a {

            text-decoration: none;

            color: #374151;

            padding:
                9px 13px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;
        }


        nav a:hover {

            background: #f3f4f6;
        }


        nav a.active {

            color: #2563eb;

            background: #eff6ff;
        }


        .student-info {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .avatar {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;
        }


        .logout-btn {

            border: none;

            background: #fee2e2;

            color: #dc2626;

            padding:
                9px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            max-width: 1200px;

            margin: auto;

            padding:
                35px 25px;
        }


        .page-header {

            margin-bottom: 25px;
        }


        .page-header h1 {

            margin:
                0 0 7px 0;

            font-size: 28px;

            color: #111827;
        }


        .page-header p {

            margin: 0;

            color: #9ca3af;

            font-size: 14px;
        }


        /* =====================================================
           RESULT CARDS
        ===================================================== */

        .results-container {

            display: grid;

            gap: 20px;
        }


        .result-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            padding: 25px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.04);
        }


        .result-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 25px;
        }


        .exam-name {

            margin: 0 0 7px 0;

            font-size: 21px;

            color: #111827;
        }


        .student-name {

            color: #6b7280;

            font-size: 14px;
        }


        .completed-badge {

            display: inline-block;

            padding:
                7px 13px;

            border-radius: 20px;

            background: #dcfce7;

            color: #16a34a;

            font-size: 12px;

            font-weight: 700;
        }


        /* =====================================================
           SCORE
        ===================================================== */

        .score-section {

            background: #eff6ff;

            border-radius: 12px;

            padding: 25px;

            text-align: center;

            margin-bottom: 20px;
        }


        .score-label {

            color: #64748b;

            font-size: 13px;

            margin-bottom: 7px;
        }


        .score {

            font-size: 42px;

            font-weight: 700;

            color: #2563eb;
        }


        /* =====================================================
           STATISTICS
        ===================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;
        }


        .stat {

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 18px;

            text-align: center;
        }


        .stat-label {

            color: #6b7280;

            font-size: 12px;

            margin-bottom: 7px;
        }


        .stat-value {

            font-size: 24px;

            font-weight: 700;

            color: #111827;
        }


        .correct {

            color: #16a34a;
        }


        .wrong {

            color: #dc2626;
        }


        .ability {

            color: #7c3aed;
        }


        .completed-time {

            margin-top: 20px;

            color: #9ca3af;

            font-size: 12px;

            text-align: right;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            padding: 60px 20px;

            text-align: center;

            color: #9ca3af;
        }


        .empty-icon {

            font-size: 50px;

            margin-bottom: 15px;
        }


        .error {

            background: #fff1f2;

            border:
                1px solid #fecdd3;

            border-radius: 12px;

            padding: 25px;

            text-align: center;

            color: #dc2626;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            padding: 25px;

            color: #9ca3af;

            font-size: 13px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            header {

                justify-content: center;
            }


            nav {

                order: 3;

                width: 100%;

                justify-content: center;
            }


            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .result-top {

                flex-direction: column;

                align-items: flex-start;
            }

        }


        @media (max-width: 500px) {

            .stats {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>


    <a
        href=""
        class="logo"
    >

        Adaptive<span>Exam</span>

    </a>


    <nav>

        <a href="index.php">
            Dashboard
        </a>

        

        

    </nav>


    <div class="student-info">

        <div
            id="studentAvatar"
            class="avatar"
        >
            S
        </div>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <div class="page-header">

        <h1>
            My Examination Results
        </h1>

        <p>
            View your completed examination results.
        </p>

    </div>


    <div
        id="resultsContainer"
        class="results-container"
    >

        <div class="empty">

            Loading your results...

        </div>

    </div>


</main>



<footer>

    © 2026 Adaptive Online Exam System

</footer>



<script>

/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    const confirmed =
        confirm(
            "Are you sure you want to logout?"
        );


    if (confirmed) {

        window.location.href =
            "login.html";

    }

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateString) {

    if (!dateString) {

        return "";

    }


    const date =
        new Date(
            dateString.replace(
                " ",
                "T"
            )
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =========================================================
   LOAD RESULTS
========================================================= */

async function loadResults() {

    const container =
        document.getElementById(
            "resultsContainer"
        );


    try {

        const response =
            await fetch(
                "../backend/student/my-result.php",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Student results:",
            data
        );


        /* =================================================
           ERROR
        ================================================= */

        if (!data.success) {

            container.innerHTML = `

                <div class="error">

                    ${escapeHtml(
                        data.message ||
                        "Unable to load your results."
                    )}

                </div>

            `;

            return;

        }


        const results =
            Array.isArray(data.results)
                ? data.results
                : [];


        /* =================================================
           NO RESULTS
        ================================================= */

        if (results.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📝
                    </div>

                    <h2>
                        No Completed Exams
                    </h2>

                    <p>
                        You have not completed any examination yet.
                    </p>

                </div>

            `;

            return;

        }


        /* =================================================
           CLEAR
        ================================================= */

        container.innerHTML = "";


        /* =================================================
           DISPLAY RESULTS
        ================================================= */

        results.forEach(
            function(result) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "result-card";


                card.innerHTML = `

                    <div class="result-top">

                        <div>

                            <h2 class="exam-name">

                                ${escapeHtml(
                                    result.exam_name
                                )}

                            </h2>

                            <div class="student-name">

                                Student:
                                <strong>
                                    ${escapeHtml(
                                        result.student_name
                                    )}
                                </strong>

                                (${escapeHtml(
                                    result.student_id
                                )})

                            </div>

                        </div>


                        <span class="completed-badge">

                            ✓ Completed

                        </span>

                    </div>


                    <div class="score-section">

                        <div class="score-label">

                            Final Score

                        </div>

                        <div class="score">

                            ${Number(
                                result.score || 0
                            )}%

                        </div>

                    </div>


                    <div class="stats">


                        <div class="stat">

                            <div class="stat-label">

                                Total Questions

                            </div>

                            <div class="stat-value">

                                ${Number(
                                    result.total_questions || 0
                                )}

                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-label">

                                Correct Answers

                            </div>

                            <div
                                class="stat-value correct"
                            >

                                ${Number(
                                    result.correct_answers || 0
                                )}

                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-label">

                                Wrong Answers

                            </div>

                            <div
                                class="stat-value wrong"
                            >

                                ${Number(
                                    result.wrong_answers || 0
                                )}

                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-label">

                                Ability Level

                            </div>

                            <div
                                class="stat-value ability"
                            >

                                ${escapeHtml(
                                    result.ability_level ||
                                    "Not Available"
                                )}

                            </div>

                        </div>


                    </div>


                    <div class="completed-time">

                        Completed on:

                        ${escapeHtml(
                            formatDate(
                                result.completed_at
                            )
                        )}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


        /* =================================================
           UPDATE AVATAR
        ================================================= */

        if (
            results[0] &&
            results[0].student_name
        ) {

            const firstLetter =
                results[0]
                    .student_name
                    .charAt(0)
                    .toUpperCase();


            document.getElementById(
                "studentAvatar"
            ).textContent =
                firstLetter;

        }

    }
    catch (error) {

        console.error(
            "Student result loading failed:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Failed to load your examination results.

                <br><br>

                Please check your login session
                and student result API.

            </div>

        `;

    }

}



/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadResults();

    }
);

</script>


</body>

</html>
