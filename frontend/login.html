<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Adaptive Online Examination System
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f5f9;

            color: #333;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            background: #0d6efd;

            color: white;

            padding: 20px;

            text-align: center;
        }


        .header h1 {

            margin: 0;

            font-size: 25px;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width: 90%;

            max-width: 500px;

            margin: 60px auto;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.10);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon {

            text-align: center;

            font-size: 60px;

            margin-bottom: 10px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .card h2 {

            text-align: center;

            margin:
                0 0 30px 0;

            color: #333;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }


        input:focus {

            outline: none;

            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px
                rgba(13,110,253,0.10);
        }


        /* =====================================================
           STUDENT LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 13px;

            background: #0d6efd;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #0b5ed7;
        }


        /* =====================================================
           REGISTER
        ===================================================== */

        .register {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }


        .register a {

            color: #0d6efd;

            text-decoration: none;

            font-weight: bold;
        }


        .register a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 28px 0;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e0e0e0;
        }


        .divider span {

            color: #999;

            font-size: 13px;

            white-space: nowrap;
        }


        /* =====================================================
           ADMIN LOGIN BUTTON
        ===================================================== */

        .admin-btn {

            display: block;

            width: 100%;

            padding: 13px;

            background: #212529;

            color: white;

            border-radius: 6px;

            text-align: center;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            transition:
                background 0.2s;
        }


        .admin-btn:hover {

            background: #000;

            color: white;
        }


        /* =====================================================
           FOOTER TEXT
        ===================================================== */

        .admin-text {

            text-align: center;

            margin-top: 10px;

            color: #777;

            font-size: 12px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .container {

                margin:
                    30px auto;
            }


            .card {

                padding: 25px 20px;
            }


            .header h1 {

                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<div class="header">

    <h1>

        Adaptive Online Examination System

    </h1>

</div>



<!-- =========================================================
     LOGIN CONTAINER
========================================================= -->

<div class="container">


    <div class="card">


        <!-- ICON -->

        <div class="icon">

            🎓

        </div>



        <!-- TITLE -->

        <h2>

            Student Login

        </h2>



        <!-- =================================================
             STUDENT LOGIN FORM
        ================================================== -->

        <form
            action="../backend/auth/student-login.php"
            method="POST"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>


                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >

                Login

            </button>


        </form>



        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="register">

            Don't have an account?

            <a href="register.html">

                Register Now

            </a>

        </div>



        <!-- =================================================
             DIVIDER
        ================================================== -->

        <div class="divider">

            <span>

                OR

            </span>

        </div>



        <!-- =================================================
             ADMIN LOGIN
        ================================================== -->

        <a
            href="admin_login.html"
            class="admin-btn"
        >

            🔐 Login as Admin

        </a>


        <div class="admin-text">

            Administrator access

        </div>


    </div>

</div>


</body>

</html>
