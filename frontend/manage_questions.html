<main style="

                font-size:14px;

        margin-bottom:20px;

<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>


// ============================================================
// GLOBAL QUESTIONS ARRAY
// ============================================================

let allQuestions = [];



// ============================================================
// LOAD QUESTIONS FROM BACKEND
// ============================================================

async function loadQuestions() {

    try {

        const response = await fetch(
            "../backend/admin/get-questions.php",
            {
                method: "GET",
                credentials: "include"
            }
        );


        if (!response.ok) {

            if (response.status === 401) {

                alert(
                    "Your admin session has expired. Please login again."
                );

                window.location.href = "login.html";

                return;
            }

            throw new Error(
                "HTTP error: " + response.status
            );
        }


        const data = await response.json();


        if (!data.success) {

            throw new Error(
                data.message || "Failed to load questions"
            );
        }


        allQuestions = data.questions || [];


        populateFilters();


        displayQuestions(allQuestions);


    } catch (error) {

        console.error(error);


        document.getElementById(
            "questionTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="
                        padding:30px;
                        text-align:center;
                        color:#dc2626;
                        font-size:14px;
                    "
                >

                    Failed to load questions.

                    <br><br>

                    Please check your backend.

                </td>

            </tr>

        `;


        document.getElementById(
            "questionCount"
        ).innerText = "Unable to load questions";


        document.getElementById(
            "showingText"
        ).innerText = "";

    }

}



// ============================================================
// POPULATE EXAM AND TOPIC FILTERS
// ============================================================

function populateFilters() {


    const examFilter =
        document.getElementById("examFilter");


    const topicFilter =
        document.getElementById("topicFilter");


    const exams = new Set();

    const topics = new Set();


    allQuestions.forEach(function(question) {

        if (question.exam_name) {

            exams.add(
                question.exam_name
            );

        }


        if (question.topic) {

            topics.add(
                question.topic
            );

        }

    });


    examFilter.innerHTML = `
        <option value="">
            All Exams
        </option>
    `;


    topicFilter.innerHTML = `
        <option value="">
            All Topics
        </option>
    `;



    Array.from(exams)
        .sort()
        .forEach(function(exam) {

            const option =
                document.createElement("option");


            option.value = exam;

            option.textContent = exam;


            examFilter.appendChild(option);

        });



    Array.from(topics)
        .sort()
        .forEach(function(topic) {

            const option =
                document.createElement("option");


            option.value = topic;

            option.textContent = topic;


            topicFilter.appendChild(option);

        });

}



// ============================================================
// DISPLAY QUESTIONS
// ============================================================

function displayQuestions(questions) {


    const table =
        document.getElementById(
            "questionTable"
        );


    table.innerHTML = "";


    if (questions.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="
                        padding:40px;
                        text-align:center;
                        color:#9ca3af;
                        font-size:14px;
                    "
                >

                    No questions found.

                </td>

            </tr>

        `;


        updateCount(0);

        return;
    }



    questions.forEach(function(question) {


        const row =
            document.createElement("tr");


        row.style.borderTop =
            "1px solid #f0f0f0";



        // ID

        const idCell =
            document.createElement("td");


        idCell.style.cssText = `
            padding:15px;
            font-size:13px;
            color:#6b7280;
        `;


        idCell.innerText =
            question.id;


        row.appendChild(idCell);



        // QUESTION

        const questionCell =
            document.createElement("td");


        questionCell.style.cssText = `
            padding:15px;
            font-size:13px;
            color:#111827;
            font-weight:500;
            max-width:350px;
        `;


        questionCell.innerText =
            question.question;


        row.appendChild(questionCell);



        // EXAM

        const examCell =
            document.createElement("td");


        examCell.style.cssText = `
            padding:15px;
            font-size:12px;
            color:#6b7280;
        `;


        examCell.innerText =
            question.exam_name || "N/A";


        row.appendChild(examCell);



        // TOPIC

        const topicCell =
            document.createElement("td");


        topicCell.style.cssText = `
            padding:15px;
            font-size:12px;
            color:#6b7280;
        `;


        topicCell.innerText =
            question.topic || "N/A";


        row.appendChild(topicCell);



        // DIFFICULTY

        const difficultyCell =
            document.createElement("td");


        difficultyCell.style.padding =
            "15px";


        const difficulty =
            document.createElement("span");


        difficulty.innerText =
            question.difficulty;


        difficulty.style.cssText = `
            padding:5px 9px;
            border-radius:15px;
            font-size:11px;
            font-weight:600;
        `;



        if (
            question.difficulty === "Easy"
        ) {

            difficulty.style.background =
                "#dcfce7";

            difficulty.style.color =
                "#16a34a";

        }


        else if (
            question.difficulty === "Medium"
        ) {

            difficulty.style.background =
                "#fef3c7";

            difficulty.style.color =
                "#d97706";

        }


        else if (
            question.difficulty === "Hard"
        ) {

            difficulty.style.background =
                "#fee2e2";

            difficulty.style.color =
                "#dc2626";

        }


        difficultyCell.appendChild(
            difficulty
        );


        row.appendChild(
            difficultyCell
        );



        // ACTIONS

        const actionCell =
            document.createElement("td");


        actionCell.style.padding =
            "15px";



        // EDIT

        const editButton =
            document.createElement("button");


        editButton.innerText =
            "Edit";


        editButton.style.cssText = `
            border:none;
            background:#eff6ff;
            color:#2563eb;
            padding:7px 10px;
            border-radius:5px;
            cursor:pointer;
            font-size:11px;
            font-weight:600;
            margin-right:5px;
        `;


        editButton.onclick =
            function() {

                editQuestion(
                    question.id
                );

            };


        actionCell.appendChild(
            editButton
        );



        // DELETE

        const deleteButton =
            document.createElement("button");


        deleteButton.innerText =
            "Delete";


        deleteButton.style.cssText = `
            border:none;
            background:#fee2e2;
            color:#dc2626;
            padding:7px 10px;
            border-radius:5px;
            cursor:pointer;
            font-size:11px;
            font-weight:600;
        `;


        deleteButton.onclick =
            function() {

                deleteQuestion(
                    question.id
                );

            };


        actionCell.appendChild(
            deleteButton
        );


        row.appendChild(
            actionCell
        );


        table.appendChild(row);

    });



    updateCount(
        questions.length
    );

}



// ============================================================
// UPDATE COUNT
// ============================================================

function updateCount(count) {


    document.getElementById(
        "questionCount"
    ).innerText =

        count +
        (
            count === 1
                ? " question available"
                : " questions available"
        );



    document.getElementById(
        "showingText"
    ).innerText =

        "Showing " +
        count +
        " of " +
        allQuestions.length +
        " questions";

}



// ============================================================
// FILTER QUESTIONS
// ============================================================

function filterQuestions() {


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const selectedExam =
        document.getElementById(
            "examFilter"
        ).value;


    const selectedDifficulty =
        document.getElementById(
            "difficultyFilter"
        ).value;


    const selectedTopic =
        document.getElementById(
            "topicFilter"
        ).value;



    const filtered =
        allQuestions.filter(
            function(question) {


                const questionText =
                    (
                        question.question || ""
                    ).toLowerCase();


                const topic =
                    question.topic || "";


                const exam =
                    question.exam_name || "";


                const difficulty =
                    question.difficulty || "";



                const matchesSearch =
                    search === "" ||
                    questionText.includes(
                        search
                    );


                const matchesExam =
                    selectedExam === "" ||
                    exam === selectedExam;


                const matchesDifficulty =
                    selectedDifficulty === "" ||
                    difficulty ===
                    selectedDifficulty;


                const matchesTopic =
                    selectedTopic === "" ||
                    topic === selectedTopic;


                return (
                    matchesSearch &&
                    matchesExam &&
                    matchesDifficulty &&
                    matchesTopic
                );

            }
        );



    displayQuestions(
        filtered
    );

}



// ============================================================
// EDIT QUESTION
// ============================================================

function editQuestion(id) {


    window.location.href =
        "add_question.html?id=" +
        encodeURIComponent(id);

}



// ============================================================
// DELETE QUESTION
// ============================================================

async function deleteQuestion(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete Question " +
            id +
            "?"
        );


    if (!confirmDelete) {

        return;

    }



    try {


        const response =
            await fetch(
                "../backend/admin/delete-question.php",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    credentials:"include",

                    body:
                        "id=" +
                        encodeURIComponent(id)
                }
            );



        const data =
            await response.json();



        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to delete question"
            );

        }



        alert(
            "Question deleted successfully."
        );



        await loadQuestions();


    }

    catch(error) {


        console.error(error);


        alert(
            "Delete failed: " +
            error.message
        );

    }

}



// ============================================================
// LOGOUT
// ============================================================

function logout() {


    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if (confirmLogout) {

        window.location.href =
            "login.html";

    }

}



// ============================================================
// LOAD QUESTIONS WHEN PAGE OPENS
// ============================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadQuestions();

    }
);


</script>
